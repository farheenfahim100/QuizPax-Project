<!DOCTYPE html>
<html lang="en">
    <head>
        <script src='/static/js/jquery-3.7.1.min.js'></script>
        <script src='/static/js/reset_password.js' defer></script>
        <link rel="stylesheet" href="/static/css/newlayout.css" type="text/css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500;1,800&display=swap" rel="stylesheet">    </head>

        <title>Reset Password: QuizPax</title>
    </head>
    <body>
        {% include 'navbar.html' %} 
        <main id="main-content">
            <section class="page-header">
                <h1>Reset Password</h1>
            </section>

            <section>
                <div id="form-box" class="form-box">
                        <form action="/reset-password" method="POST" id="reset-password-form">
                            
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                            <label for="email">Email:</label><br>
                            <input type="email" id="email" name="email" autocomplete="email">

                            <button type="submit" class="primary-btn" id="SendOTP">Send one-time passcode</button>
                        </form>
                    <br>
                    <div id="OTP-wrapper">
                        <div id="forgottenPassword"></div>
                    </div>
                </div>
                <br>
                <br>
            </section>
        </main>
        {% include 'footer.html' %} 
    </body>
</html>
